<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home | Exclosure</title>
  <meta name="description" content="Exclosure" />
  <meta property="og:title" content="Exclosure" />
  <meta property="og:image" content="https://exclosure.io/img/header.png" />
  <meta name="theme-color" content="#0b1226" />
  <link rel="icon" href="/img/logo.png" />
  <style>
    :root {
      --bg: #0b1226;
      --ink: #e8ecf5;
      --muted: #8a93ad;
      --accent: #6ca8e0;
      --field: #131c36;
      --border: #2a3556;
    }
    * { box-sizing: border-box; }
    html, body { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--ink);
      line-height: 1.5;
    }
    main {
      max-width: 960px;
      margin: auto;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    .banner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }
    .logo-img { flex: 1 1 420px; max-width: 640px; width: 100%; height: auto; border-radius: 4px; }
    .cta { flex: 1 1 260px; max-width: 320px; text-align: left; }
    a { color: var(--accent); }

    .tagline { font-size: 1.1rem; font-style: italic; margin: 0 0 0.4rem; color: var(--ink); }
    .request { margin: 0 0 1rem; font-weight: 600; }
    .request a { text-decoration: none; }
    .request a:hover { text-decoration: underline; }

    .signup {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 0 0 1rem;
    }
    .signup input {
      flex: 1 1 240px;
      min-width: 0;
      padding: 0.6rem 0.8rem;
      font-size: 1rem;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .signup input::placeholder { color: var(--muted); }
    .signup input:focus { outline: none; border-color: var(--accent); }
    .signup button {
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      color: var(--bg);
      background: var(--ink);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
    }
    .signup button:hover { background: #fff; }
    .thanks { color: var(--accent); margin: 1rem 0; }
    .contact { font-size: 1.05rem; margin: 0.5rem 0 2rem; }
    .social { display: flex; gap: 1.25rem; justify-content: center; margin: 1.25rem 0 0.75rem; }
    .social img { width: 28px; height: 28px; }
    footer { color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem; }
    footer a { color: var(--muted); }
    footer p { margin: 0.25rem 0; }
    .naics { word-spacing: 0.15rem; }
    .sep { margin: 0 0.5rem; }
  </style>
</head>
<body>
  <main>
    <div class="banner">
      <img class="logo-img" src="/img/header.png" alt="Exclosure" />
      <div class="cta">
        <p class="tagline">Tasteful, discreet SDA services.</p>
        <p class="request"><a id="request-link" href="#">Request contact &rarr;</a></p>
        <form class="signup" id="signup">
          <input type="email" id="email" name="email" placeholder="Enter your email here *" required />
          <button type="submit">Submit</button>
        </form>
        <p class="thanks" id="thanks" hidden>Thanks! We've added you to our list.</p>
        <p class="contact"><a id="contact-link" href="#">email</a></p>
      </div>
    </div>

    <div class="social">
      <a href="https://twitter.com/TheExclosure" aria-label="Twitter"><img src="/img/twitter.png" alt="Twitter" /></a>
      <a href="https://www.linkedin.com/company/exclosure/" aria-label="LinkedIn"><img src="/img/linkedin.png" alt="LinkedIn" /></a>
    </div>

    <footer>
      <p class="naics">NAICS 334511, 513210, 541330, 541370, 541511, 541519, 541715, 541990</p>
      <p>&copy;<span id="year">2026</span> by Exclosure<span class="sep">·</span><a href="/legal.html">Legal</a></p>
    </footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    // Lightly obfuscate the address so plain scrapers don't grab it from source.
    function rot13(s) {
      return s.replace(/[a-z]/gi, function (c) {
        var base = c <= "Z" ? 65 : 97;
        return String.fromCharCode(((c.charCodeAt(0) - base + 13) % 26) + base);
      });
    }
    var contactEmail = rot13("vasb@rkpybfher.vb");

    var contactLink = document.getElementById("contact-link");
    contactLink.href = "mailto:" + contactEmail;
    contactLink.textContent = contactEmail;

    document.getElementById("request-link").href =
      "mailto:" + contactEmail + "?subject=" + encodeURIComponent("Request contact");

    document.getElementById("signup").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("email").value.trim();
      if (!email) return;
      var subject = encodeURIComponent("Subscribe");
      var body = encodeURIComponent("Please add me to your list: " + email);
      window.location.href = "mailto:" + contactEmail + "?subject=" + subject + "&body=" + body;
      document.getElementById("signup").hidden = true;
      document.getElementById("thanks").hidden = false;
    });
  </script>
</body>
</html>
